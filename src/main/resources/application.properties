spring.application.name=trackinvest

spring.datasource.url=jdbc:postgresql://localhost:5432/TrackInvest
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ConfiguraciÃÂ³n de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ConfiguraciÃÂ³n de AWS Cognito
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${COGNITO_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.clientId=${COGNITO_CLIENT_ID}
spring.security.oauth2.resourceserver.jwt.clientSecret=${COGNITO_CLIENT_SECRET}
auth.cognitoUri=${COGNITO_URI}

# RabbitMQ configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Actuator configuration for Kubernetes health probes
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.health.rabbit.enabled=true
